<div class="invokeopcua-div ul-label-large" id="invokeopcua-main-container">
    <div id="invokeopcua-content-section" class="ul-form-container invokeopcua-div-height">
        <div class="ul-form-small ul-col-lg-8 ul-pad-0x">
            <div id="invokeopcua-connection-component-container">
                <div class="ul-form-row ul-flex-gap-3x ul-pad-2x-b">
                    <div id="connectionComboBox-row" class="ul-label-container propertyLabels">
                        <label class="ul-required ul-body-m-b" for="connectionComboBox"><%-nls.Connection%></label>
                    </div>
                    <div class="ul-form-row ul-flex-gap-3x ul-input-container">
                        <div class="propertyValue ul-input-container ul-flex-col-container">
                            <input id="connectionComboBox" class="ul-container">
                        </div>
                        <div id="refresh-connection-button" title="<%-nls.RefreshConnection%>" class="eQ-icon eQ-fonts-2x eQ-fonts-refresh"></div>
                    </div>
                </div>
            </div>

            <div class="invokeopcua-config-controls" style="display: none;">
                <div class="ul-form-row ul-flex-gap-3x ul-pad-2x-b">
                    <div class="ul-label-container">
                        <label class="ul-body-m-b ul-required" for="data-change-write-radio"><%-nls.Operation%></label>
                    </div>
                    <div class="ul-field-container ul-flex-container">
                        <div class="ul-pad-3x-r">
                            <input type="radio" id="data-change-write-radio" class="k-radio data-change-write-radio" value="DATA_CHANGE_WRITE"/>
                            <label class="k-radio-label ul-body-m-b" for="data-change-write-radio"><%-nls.DataChangeWrite%></label>
                        </div>
                        <div>
                            <input type="radio" id="call-method-radio" class="k-radio call-method-radio" value="CALL_METHOD"/>
                            <label class="k-radio-label ul-body-m-b" for="call-method-radio"><%-nls.CallMethod%></label>
                        </div>
                    </div>
                </div>

                <div class="ul-form-row ul-flex-gap-3x">
                    <div class="ul-label-container">
                        <label class="ul-body-m-b ul-required" for="parallel-mode-radio"><%-nls.ExecutionMode%></label>
                    </div>
                    <div class="ul-field-container ul-flex-container">
                        <div class="ul-pad-3x-r ul-flex-container">
                            <input type="radio" id="parallel-mode-radio" class="k-radio parallel-mode-radio" value="PARALLEL"/>
                            <label class="k-radio-label ul-body-m-b ul-pad-1x-r" for="parallel-mode-radio"><%-nls.Parallel%></label>
                            <div id="parallel-mode-help-container" class="grid-help-container" data-help="<%-nls.ParallelHelp%>"></div>
                        </div>
                        <div class="ul-flex-container">
                            <input type="radio" id="sequential-mode-radio" class="k-radio sequential-mode-radio" value="SEQUENTIAL"/>
                            <label class="k-radio-label ul-body-m-b ul-pad-1x-r" for="sequential-mode-radio"><%-nls.Sequential%></label>
                            <div id="sequential-mode-help-container" class="grid-help-container" data-help="<%-nls.SequentialHelp%>"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="ul-form-large ul-pad-0x invokeopcua-grids-section" style="display: none;">
            <div class="data-change-write-container">
                <div class="ul-form-row ul-flex-gap-3x ul-pad-2x-b">
                    <div class="ul-label-container">
                        <label class="ul-body-m-b ul-required" for="data-change-write-region"><%-nls.DataChangeWrite%></label>
                    </div>

                    <div class="ul-input-container">
                        <div id="data-change-write-region">
                            <div class="cvt-grid-div cvt-grid-div-data-change-write"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="call-method-container">
                <div class="ul-form-row ul-flex-gap-3x ul-pad-2x-b">
                    <div class="ul-label-container">
                        <label class="ul-body-m-b ul-required" for="call-method-region"><%-nls.CallMethod%></label>
                    </div>

                    <div class="ul-input-container">
                        <div id="call-method-region">
                            <div class="cvt-grid-div cvt-grid-div-call-method"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="invokeopcua-address-space-drawer-section" name="invokeopcua-address-space-drawer-section" class="layouting-div">
        <div id="invokeopcua-address-space-component"></div>
    </div>
</div>
