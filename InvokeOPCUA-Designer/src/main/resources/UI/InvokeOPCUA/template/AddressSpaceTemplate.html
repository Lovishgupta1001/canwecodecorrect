<div class="opcua-browse-address-space-div ul-form-container ul-label-small ul-pad-2x">
    <div class="address-space-header ul-pad-1x-b ul-flex-container ul-space-between">
        <span class="ul-header-xs-b"><%-nls.BrowseAddressSpace%></span>
    </div>

    <div class="address-space-search-row ul-form-row ul-pad-1x-b">
        <div class="ul-input-container" style="width: 100%;">
            <input id="address-space-search-textbox" class="address-space-search-input ul-container" type="text"
                   placeholder="<%-nls.SearchAddressSpace%>" />
        </div>
    </div>

    <div class="address-space-treelist-wrapper">
        <div id="address-space-treelist" class="ul-mi-treelist ul-form-small"></div>
    </div>

    <div class="address-space-actions ul-pad-2x-t ul-flex-gap-2x">
        <button id="address-space-select-btn" class="k-button ul-tertiary-button" type="button" disabled="disabled">
            <%-nls.SelectNode%>
        </button>
    </div>

    <div class="address-space-loading-container"></div>
</div>
